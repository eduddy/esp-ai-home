spi:
  id: display_qspi
  type: quad
  clk_pin: 40
  data_pins: [46, 45, 42, 41]

i2c:
  sda: 11
  scl: 10
  id: touchscreen_bus

pca9554:
  - id: pca9554a_device
    address: 0x20

touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin: 4
    reset_pin:
      pca9554: pca9554a_device
      number: 0
    display: main_display
    i2c_id: touchscreen_bus
    on_touch:
      - lambda: |-
          if (touch.x > 0) id(touch_start_x) = touch.x;
          id(touch_start_time) = millis();
          id(last_touch_x) = touch.x;
    on_update:
      - lambda: |-
           if (!touches.empty()) {
             id(last_touch_x) = touches.begin()->x;
           }
    on_release:
      - lambda: |-
          int delta = abs(id(touch_start_x) - id(last_touch_x));
          int duration = millis() - id(touch_start_time);

          if (delta > 50) {
             // Swipe
             if (id(last_touch_x) > id(touch_start_x)) {
                // Swipe Right (Prev)
                id(current_page) = 0;
             } else {
                // Swipe Left (Next)
                id(current_page) = 1;
             }
             id(draw_display).execute();
          } else {
             // Tap or Hold
             if (duration > 1000) {
                 // Hold
                 id(show_battery_status).toggle();
                 id(draw_display).execute();
             } else {
                 // Short Tap
                 id(handle_screen_tap).execute();
             }
          }

display:
  - platform: ${display_platform}
    id: main_display
    model: ${display_model}
    rotation: ${rotate_display}
    cs_pin: 21
    reset_pin:
      pca9554: pca9554a_device
      number: 1
    update_interval: never
    pages:
      - id: idle_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(img_idle), ImageAlign::CENTER);
          // Optional: Overlay battery
      - id: dashboard_page
        lambda: |-
          // Dashboard Background
          it.fill(Color(20, 20, 20)); // Dark Grey

          // Dimensions
          int w = it.get_width();
          int h = it.get_height();
          int cx = w / 2;
          int cy = h / 2;

          // --- TOP: Persons ---
          int top_y = 60;
          // Person 1 (Ed)
          Color ed_col = (id(person_edward).state == "home") ? Color(0, 255, 0) : Color(128, 128, 128);
          it.printf(cx - 60, top_y, id(icon_font), ed_col, TextAlign::CENTER, "\ue7fd");
          it.printf(cx - 60, top_y + 35, id(font_request_response), Color::WHITE, TextAlign::CENTER, "Ed");

          // Person 2 (Meg)
          Color meg_col = (id(person_meg).state == "home") ? Color(0, 255, 0) : Color(128, 128, 128);
          it.printf(cx + 60, top_y, id(icon_font), meg_col, TextAlign::CENTER, "\ue7fd");
          it.printf(cx + 60, top_y + 35, id(font_request_response), Color::WHITE, TextAlign::CENTER, "Meg");

          // --- CENTER: Temps ---
          int mid_y = cy + 10;
          it.printf(cx, mid_y, id(font_big_clock_mono), Color::WHITE, TextAlign::CENTER, "%.1f°", id(house_temp).state);
          it.printf(cx, mid_y + 30, id(font_request_response), Color(128, 128, 128), TextAlign::CENTER, "Bed: %.1f°", id(bedroom_temp).state);

          // --- BOTTOM: Devices ---
          int bot_y = h - 70;
          // TV
          Color tv_col = (id(tv_status).state == "playing" || id(tv_status).state == "on") ? Color(255, 255, 0) : Color(128, 128, 128);
          it.printf(cx - 50, bot_y, id(icon_font), tv_col, TextAlign::CENTER, "\ue338");

          // Light
          Color light_col = (id(bedroom_lights).state) ? Color(255, 255, 0) : Color(128, 128, 128);
          it.printf(cx + 50, bot_y, id(icon_font), light_col, TextAlign::CENTER, "\ue0f0");


      - id: listening_page
        lambda: |-
          it.fill(id(listening_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(img_listening), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
