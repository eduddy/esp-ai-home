esphome:
  name: esphome-web-f70308
  friendly_name: HolaSmart32
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

psram:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

# Enable Web Server
web_server:
  port: 80

mqtt:
  broker: 192.168.1.177
  port: 1883
  username: edwardduddy
  password: !secret mqtt_password

# Enable Time (SNTP)
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/New_York" # Change to your timezone

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "HolaSmart32 Fallback Hotspot"
    password: "password"

captive_portal:

binary_sensor:
  - platform: gpio
    pin: GPIO12
    name: "PIR Sensor"
    device_class: motion
    id: pir
    filters:
      - delayed_on: 1s
    on_press:
      - script.execute: wave_hand_script

# Sensors
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: internal_temperature
    name: "Internal Temperature"

# Restart Switch
switch:
  - platform: restart
    name: "Restart Device"

image:
  - file: "config/esphome/bg96.png" # Changed to relative path for portability
    id: gui
    type: RGB565

animation:
  - file: "config/esphome/face5.gif"
    id: anim
    type: RGB565

# Servo setup
output:
  - platform: ledc
    id: pwm_output
    pin: GPIO5
    frequency: 50 Hz
  - platform: ledc
    id: pwm_output2
    pin: GPIO23
    frequency: 50 Hz

servo:
  - id: my_servo
    output: pwm_output
  - id: my_servo2
    output: pwm_output2

number:
  - platform: template
    name: "HolaServo RUpper"
    id: servo_1
    min_value: -100
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    on_value:
      then:
        - servo.write:
            id: my_servo
            # Map -100..100 to 0.0..1.0
            level: !lambda 'return (x + 100.0) / 200.0;'

  - platform: template
    name: "HolaServo LUpper"
    id: servo_2
    min_value: -100
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    on_value:
      then:
        - servo.write:
            id: my_servo2
            # Map -100..100 to 0.0..1.0
            level: !lambda 'return (x + 100.0) / 200.0;'

script:
  - id: wave_hand_script
    mode: restart
    then:
      # 1. Calibration / Center (0.5 = 90 degrees)
      - logger.log: "Phase 1: Calibrating to Center (90 degrees)"
      - servo.write:
          id: my_servo
          level: 0.5
      - delay: 1s

      # 2. Raise to "Wave" position (0.94 approx 170 degrees)
      - logger.log: "Phase 2: Raising arm"
      - servo.write:
          id: my_servo
          level: 0.94
      - delay: 1s

      # 3. Wave Action (3 times)
      - logger.log: "Phase 3: Waving"
      - repeat:
          count: 3
          then:
            # Move Left/Down (0.78 approx 140 degrees)
            - servo.write:
                id: my_servo
                level: 0.78
            - delay: 350ms

            # Move Right/Up (0.94 approx 170 degrees)
            - servo.write:
                id: my_servo
                level: 0.94
            - delay: 350ms

      # 4. Stow (Return to 0 degrees = 0.0)
      - logger.log: "Phase 4: Stowing arm"
      - servo.write:
          id: my_servo
          level: 0.0
      - delay: 2s

# Button to trigger the script from Home Assistant
button:
  - platform: template
    name: "Wave Hand"
    icon: "mdi:hand-wave"
    on_press:
      - script.execute: wave_hand_script

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

font:
  - file: "config/esphome/Roboto.ttf"
    id: my_font
    size: 12
  - file: "config/esphome/FjallaOne.ttf"
    id: g_font
    size: 13
  - file: "config/esphome/FjallaOne.ttf"
    id: sm_font
    size: 10


color:
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: ssd1331_spi
    id: OLED
    cs_pin: GPIO4
    dc_pin: GPIO16
    reset_pin: GPIO17
    rotation: 0
    update_interval: 1s
    pages:
      - id: page1
        lambda: |-
          // it.image(0, 0, id(gui));
          it.print(it.get_width() / 2, 0, id(g_font), id(my_white), TextAlign::TOP_CENTER, "H0LASMART.32");
          it.line(1, 17, 95, 15);
          it.printf(15, 35, id(sm_font), id(my_white), TextAlign::TOP_LEFT, "R.ARM: %.0f", id(servo_2).state);
          it.printf(15, 20, id(sm_font), id(my_white), TextAlign::TOP_LEFT , "L.ARM: %.0f", id(servo_1).state);

          // Show time if available
          if (id(sntp_time).now().is_valid()) {
             it.strftime(50, 50, id(sm_font), id(my_white), TextAlign::TOP_CENTER, "%H:%M", id(sntp_time).now());
          }

          it.line(1, 15, 95, 15);
          it.rectangle(1, 45, 94, 15);
      - id: page2
        lambda: |-
          if (id(pir).state)
          {
            id(anim).next_frame();
            it.image(0, 0, id(anim), COLOR_ON, COLOR_OFF);
          }
          else
          {
            id(anim).next_frame();
            it.image(0, 35, id(anim), COLOR_ON, COLOR_OFF);
          }
          if (id(sntp_time).now().is_valid())
          {
            it.strftime(50, 50, id(sm_font), id(my_white), TextAlign::TOP_CENTER, "%H:%M", id(sntp_time).now());
          }

interval:
  - interval: 15s
    then:
      - display.page.show_next: OLED
